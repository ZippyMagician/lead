[package]
name = "lead"
version = "0.1.0"
edition = "2024"

[lib]
name = "lead_core"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
ecow = "0.3.1"
libloading = { version = "0.9.0", optional = true }
num-traits = "0.2.19"
ordered-float = "5.5.0"
smallvec = { version = "1.16.2", features = ["union"] }
typed-arena = "2.0.2"

[features]
default = []
wasm = []
ffi = ["dep:libloading"]
